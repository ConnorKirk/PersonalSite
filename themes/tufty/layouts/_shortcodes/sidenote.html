{{- /* Numbered note in the right margin. Usage: text{{< sidenote >}}The note.{{< /sidenote >}} */ -}}
{{- $id := printf "sn-%d" .Ordinal -}}
<label for="{{ $id }}" class="margin-toggle sidenote-number"></label><input type="checkbox" id="{{ $id }}" class="margin-toggle"><span class="sidenote">{{ .Inner | strings.TrimSpace | .Page.RenderString }}</span>
